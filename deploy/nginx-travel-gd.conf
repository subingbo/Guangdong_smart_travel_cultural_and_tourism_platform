# /etc/nginx/sites-available/travel-gd.conf
# Public entry for the Travel Guangdong website on a dedicated port.
# Does not touch the existing site on :80.
server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /opt/travel-gd/web;
    index index.html;

    access_log /var/log/nginx/travel-gd.access.log;
    error_log  /var/log/nginx/travel-gd.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Vite emits hashed asset names; safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React SPA fallback (the app uses HashRouter, this is extra safety).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the frontend calls /api/... and never needs CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI route/chat calls can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
