# Syntax: mysql>8.0 compatible. See docker-compose.yml for how these run.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: travel_gd
      MYSQL_USER: travelgd
      MYSQL_PASSWORD: travelgd
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    ports:
      - "3306:3306"

  server-java:
    build: ./server-java
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: travelgd
      DB_PASSWORD: travelgd
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TENCENT_MAP_API_KEY: ${TENCENT_MAP_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  server-go:
    build: ./server-go
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: travelgd
      DB_PASSWORD: travelgd
      DB_NAME: travel_gd
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TENCENT_MAP_API_KEY: ${TENCENT_MAP_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server-java
    ports:
      - "80:80"

volumes:
  mysql-data:
