<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-900 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header (Transparent) -->
    <div class="absolute top-0 w-full p-4 pt-12 z-20 flex justify-between items-center text-white">
        <a href="merchant.html" class="bg-black/20 p-2 rounded-full backdrop-blur-sm hover:bg-black/40 transition">
            <i class="ri-arrow-left-line text-2xl"></i>
        </a>
        <div class="bg-black/20 px-3 py-1 rounded-full backdrop-blur-sm text-xs font-medium border border-white/20">
            Scanning...
        </div>
        <button class="bg-black/20 p-2 rounded-full backdrop-blur-sm hover:bg-black/40 transition">
            <i class="ri-flashlight-line text-xl"></i>
        </button>
    </div>

    <!-- Camera View (Placeholder Image) -->
    <div class="flex-1 relative bg-black">
        <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?q=80&w=1000&auto=format&fit=crop" alt="Menu" class="w-full h-full object-cover opacity-80">
        
        <!-- Scan Frame -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-64 h-64 border-2 border-white/50 rounded-xl relative">
                <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-blue-500 -mt-1 -ml-1"></div>
                <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-blue-500 -mt-1 -mr-1"></div>
                <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-blue-500 -mb-1 -ml-1"></div>
                <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-blue-500 -mb-1 -mr-1"></div>
                
                <!-- Scanning Line Animation -->
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500 shadow-[0_0_10px_#3b82f6] animate-[scan_2s_infinite]"></div>
            </div>
        </div>

        <!-- Detected Text Overlay (Simulated) -->
        <div class="absolute top-1/3 left-1/4 bg-white/90 text-black text-xs px-2 py-1 rounded shadow-lg backdrop-blur-sm transform -translate-y-1/2 cursor-pointer hover:scale-105 transition">
            <span class="font-bold">虾饺</span> (Shrimp Dumpling)
            <i class="ri-arrow-right-s-line ml-1 text-gray-400"></i>
        </div>

    </div>

    <!-- Controls -->
    <div class="bg-black text-white p-6 pb-12 rounded-t-3xl -mt-6 z-10 relative">
        <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto mb-6"></div>
        
        <div class="flex justify-between items-center mb-6">
            <div class="text-center w-16">
                <div class="w-10 h-10 bg-gray-800 rounded-full mx-auto flex items-center justify-center mb-1">
                    <i class="ri-image-line text-gray-400"></i>
                </div>
                <span class="text-[10px] text-gray-400">Album</span>
            </div>
            
            <div class="w-16 h-16 border-4 border-white rounded-full flex items-center justify-center p-1 cursor-pointer active:scale-95 transition">
                <div class="w-full h-full bg-white rounded-full"></div>
            </div>

            <div class="text-center w-16">
                <div class="w-10 h-10 bg-gray-800 rounded-full mx-auto flex items-center justify-center mb-1">
                    <i class="ri-translate-2 text-gray-400"></i>
                </div>
                <span class="text-[10px] text-gray-400">Auto-Trans</span>
            </div>
        </div>

        <!-- Result Card (Simulated) -->
        <div class="bg-gray-800 rounded-xl p-4 flex gap-3 items-start border border-gray-700">
            <div class="w-16 h-16 bg-gray-700 rounded-lg bg-cover bg-center flex-shrink-0" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Har_gow.jpg/1200px-Har_gow.jpg');"></div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-white text-sm">Shrimp Dumpling (Har Gow)</h3>
                    <span class="bg-blue-600 text-[10px] px-1.5 py-0.5 rounded text-white">Top Pick</span>
                </div>
                <p class="text-gray-400 text-xs mt-1 line-clamp-2">Translucent dumpling skin wrapped around whole shrimp. A must-try dim sum classic.</p>
            </div>
        </div>
    </div>

    <style>
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>

</body>
</html>
