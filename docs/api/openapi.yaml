          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /agent/runs/{id}:
    get:
      tags: [agent]
      summary: Run snapshot (poll fallback and reconnect)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentSnapshot'
        '404':
          $ref: '#/components/responses/Error'

  /agent/runs/{id}/events:
    get:
      tags: [agent]
      summary: Server-Sent Events stream for a run
      description: |
        The first event is always `snapshot`. Subsequent events are `delta`,
        `thinking`, `tool_call`, `tool_result`, `plan`, `done`, `error`, and
        `heartbeat` (15 s). `id:` carries the run sequence number; clients
        should ignore events with seq <= the snapshot seq. Requires the normal
        Authorization header, so use fetch streaming rather than EventSource.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 0
                  event: snapshot
                  data: {"type":"snapshot","seq":0,"runId":12,"data":{"status":"running","output":""}}
        '404':
          $ref: '#/components/responses/Error'

  /agent/runs/{id}/cancel:
    post:
      tags: [agent]
      summary: Cancel a running or queued run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
